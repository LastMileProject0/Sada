[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Salma_Alamro", email = "66250333-salmasalamro@users.noreply.replit.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openpyxl>=3,<4",
    "pandas>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "pytest>=9.2.0",
    "uvicorn>=0.30,<1",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
