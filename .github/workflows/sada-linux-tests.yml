name: SADA Linux Backend Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: website/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements.txt pytest httpx "psycopg[binary]"

      - name: Run SADA backend tests
        working-directory: website/backend
        run: python -m pytest tests -q --tb=short
