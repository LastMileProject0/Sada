name: LastMile Step 3 Integration Tests

on:
  push:
    branches:
      - main
      - integration/step3-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run full Step 3 tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
